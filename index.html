    <!--

      client-rendered, and a crawler that gives up before executing the bundle
      still gets the entity, the service list and the city from here.

      business and website. These signals help search engines understand the
      brand without guaranteeing ranking.

      Deliberately absent: `telephone`, `streetAddress`, `openingHours`,
      `aggregateRating`. None of them were ever confirmed. Invented values are
      what gets a business's Knowledge Panel suppressed, and a fabricated
      rating is a manual-action risk. Fill them in alongside the real details
      in `src/data/contact.js`.
    -->
